name: Build 3DViewer

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Build number
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      label: ${{ steps.v.outputs.label }}
      day: ${{ steps.v.outputs.day }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # src/VERSION holds major.minor; people see V1.0, V1.01 … V1.10; the app compares 2100.<major+1>.<minor>
          IFS=. read -r MA MI < src/VERSION
          MI=$((10#$MI))
          echo "ver=2100.$((MA + 1)).$MI" >> "$GITHUB_OUTPUT"
          if [ "$MI" -eq 0 ]; then echo "label=V$MA.0" >> "$GITHUB_OUTPUT"; else echo "label=V$MA.$(printf %02d $MI)" >> "$GITHUB_OUTPUT"; fi
          echo "day=$(TZ=Europe/Moscow date +%d.%m.%Y)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows EXE (WebView2)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Web app inside the exe
        shell: bash
        run: |
          pip install pillow > /dev/null
          python src/build.py win
          echo "window.TDV_BUILD = { version: '${{ needs.meta.outputs.ver }}', label: '${{ needs.meta.outputs.label }}', day: '${{ needs.meta.outputs.day }}', app: 'windows' };" > www/build-info.js
          printf 'version=%s\napp=3DViewer\n' "${{ needs.meta.outputs.ver }}" > src/win/build.txt
          cp www/icon.ico src/win/icon.ico
          cd www && 7z a -tzip -mx=9 ../src/win/www.zip . > /dev/null
      - name: Build the exe
        shell: bash
        run: |
          IFS=. read -r MA MI < src/VERSION; MI=$(echo "$MI" | tr -dc 0-9)
          if ! dotnet build src/win/3DViewer.csproj -c Release -nologo -p:TdvFileVersion=$MA.$((10#$MI)).0 > build.log 2>&1; then
            grep -iE "error|warn" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; tail -5 build.log; exit 1
          fi
      - name: Installer, update feed
        shell: bash
        run: |
          EXE=$(find src/win/bin -name 3DViewer.exe | head -1)
          mkdir -p dist && cp "$EXE" src/win/3DViewer.exe
          MN=$(command -v makensis || true); [ -z "$MN" ] && MN="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -f "$MN" ] || command -v makensis > /dev/null || choco install nsis -y --no-progress > /dev/null
          cd src/win
          if ! "$MN" -V2 -DVERSION=${{ needs.meta.outputs.ver }} -DOUTFILE=3DViewer-Setup.exe -DEXE=3DViewer.exe installer.nsi > nsis.log 2>&1; then
            tail -25 nsis.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          mv 3DViewer-Setup.exe ../../dist/ && cd ../..
          # latest.yml: the feed the earlier Electron build checks, so it updates itself to this one
          SHA=$(openssl dgst -sha512 -binary dist/3DViewer-Setup.exe | openssl base64 -A); SIZE=$(stat -c %s dist/3DViewer-Setup.exe)
          printf 'version: %s\nfiles:\n  - url: 3DViewer-Setup.exe\n    sha512: %s\n    size: %s\npath: 3DViewer-Setup.exe\nsha512: %s\nreleaseDate: %s\n' "${{ needs.meta.outputs.ver }}" "$SHA" "$SIZE" "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > dist/latest.yml
          echo "::notice::$(ls -la dist | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: 3DViewer-windows
          path: dist/*

  release:
    name: Release (download links, updates)
    needs: [meta, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
          LABEL: ${{ needs.meta.outputs.label }}
          DAY: ${{ needs.meta.outputs.day }}
        run: |
          set -e
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          printf '%s\n' "3DViewer $LABEL от $DAY." "" "Всегда последняя версия:" "- Windows, установщик: $BASE/3DViewer-Setup.exe" > notes.md
          gh release delete "v$VER" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true  # same version rebuilt: replace it
          gh release create "v$VER" dl/3DViewer-windows/* --repo "$GITHUB_REPOSITORY" --title "3DViewer $LABEL — $DAY" --notes-file notes.md --latest
      - name: Keep only the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.meta.outputs.ver }}
        run: |
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q '.[].tag_name'); do
            [ "$t" = "v$VER" ] || gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
